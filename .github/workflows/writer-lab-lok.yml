name: Writer isolated official LibreOfficeKit probe
on:
  workflow_dispatch:
    inputs:
      office_layout:
        description: Installation location inside the disposable fixture
        type: choice
        default: separate
        options: [separate, python-read-root]
permissions:
  contents: read
jobs:
  lok:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install archival Writer 26.2.6.2
        shell: pwsh
        run: ./lab/install-writer.ps1
      - name: Install pinned bounded diagnostic dependencies
        run: python -m pip install jsonschema==4.26.0 pytest==9.1.1
      - name: Read official C ABI export table without executing Writer
        shell: pwsh
        run: python -m lab.inspect_office_exports > lab-evidence/lok-exports.json
      - name: Official library inside unchanged native boundary, 45 seconds
        shell: pwsh
        run: ./lab/run-standard-user.ps1 -Suite probe -OfficeLayout '${{ inputs.office_layout }}'
      - name: Preserve success or failure without claiming product PASS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writer-lok-probe
          path: |
            lab-evidence/standard-user/
            lab-evidence/standard-user-launch/
            lab-evidence/libreoffice-version.txt
            lab-evidence/writer-binary-hash.json
            lab-evidence/lok-exports.json
          if-no-files-found: error
