name: Writer isolated candidate real routes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install archival Writer 26.2.6.2
        shell: pwsh
        run: ./lab/install-writer.ps1
      - run: python -m pip install jsonschema==4.26.0 pytest==9.1.1
      - name: Original real routes, original Human Gate and restart assertions
        shell: pwsh
        run: ./lab/run-standard-user.ps1 -Suite routes
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writer-candidate-routes
          path: lab-evidence/
          if-no-files-found: error
