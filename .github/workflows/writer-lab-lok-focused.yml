name: Writer LibreOfficeKit focused diagnostic
on:
  workflow_dispatch:
  push:
    branches: ['work/writer-offline-symbol-reader-20261009']
    paths:
      - '.github/workflows/writer-lab-lok-focused.yml'
permissions:
  contents: read
jobs:
  lok:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install archival Writer 26.2.6.2
        shell: pwsh
        run: ./lab/install-writer.ps1
      - run: python -m pip install jsonschema==4.26.0 pytest==9.1.1
      - name: Official LibreOfficeKit probes inside unchanged native boundary
        shell: pwsh
        continue-on-error: true
        run: ./lab/run-standard-user.ps1 -Suite probe
      - name: Print bounded LOK stage reports
        if: always()
        shell: pwsh
        run: |
          $reports=Get-ChildItem -LiteralPath lab-evidence -Recurse -Filter 'probe.json' -ErrorAction SilentlyContinue
          if(-not $reports) { Write-Host 'NO_LOK_PROBE_REPORT'; exit 0 }
          foreach($report in $reports) {
            Write-Host ('=== ' + $report.FullName + ' ===')
            Get-Content -LiteralPath $report.FullName -Raw
          }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writer-lok-focused-evidence
          path: |
            lab-evidence/standard-user/
            lab-evidence/standard-user-launch/
            lab-evidence/lok-exports.json
            lab-evidence/libreoffice-version.txt
            lab-evidence/writer-binary-hash.json
          if-no-files-found: warn
