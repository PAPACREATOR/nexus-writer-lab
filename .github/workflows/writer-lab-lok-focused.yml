name: Writer LibreOfficeKit focused diagnostic
on:
  workflow_dispatch:
  push:
    branches: ['work/writer-offline-symbol-reader-20261009']
    paths:
      - '.github/workflows/writer-lab-lok-focused.yml'
permissions:
  contents: read
jobs:
  lok:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install archival Writer 26.2.6.2
        shell: pwsh
        run: ./lab/install-writer.ps1
      - run: python -m pip install jsonschema==4.26.0 pytest==9.1.1
      - name: Official LibreOfficeKit probes inside unchanged native boundary
        shell: pwsh
        continue-on-error: true
        run: ./lab/run-standard-user.ps1 -Suite probe

      - name: Parse LibreOfficeKit terminal stages
        id: lok
        if: always()
        shell: pwsh
        run: |
          @'
          import json, os, pathlib
          reports=list(pathlib.Path("lab-evidence").rglob("probe.json"))
          terminal=[]
          for path in reports:
              try:
                  obj=json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              stages=obj.get("stages") or []
              last=stages[-1].get("stage") if stages and isinstance(stages[-1],dict) else "no_stage"
              terminal.append(last)
              print(json.dumps({"file":str(path),"last_stage":last,
                                "exit_code":obj.get("exit_code"),
                                "render_pass":obj.get("render_pass"),
                                "seconds":obj.get("seconds"),
                                "error":obj.get("error")}, ensure_ascii=False))
          unique=sorted(set(terminal))
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("terminal=" + ",".join(unique) + "\n")
              f.write("reports=" + str(len(reports)) + "\n")
          '@ | python -

      - name: LOK OBSERVED no reports
        if: always() && steps.lok.outputs.reports == '0'
        run: echo "No probe reports"
      - name: LOK OBSERVED network_denied terminal
        if: always() && contains(format(',{0},', steps.lok.outputs.terminal), ',network_denied,')
        run: echo "Stopped after network denial stage"
      - name: LOK OBSERVED loading_library terminal
        if: always() && contains(format(',{0},', steps.lok.outputs.terminal), ',loading_library,')
        run: echo "Stopped while loading mergedlo.dll"
      - name: LOK OBSERVED initializing_lok terminal
        if: always() && contains(format(',{0},', steps.lok.outputs.terminal), ',initializing_lok,')
        run: echo "Blocked inside libreofficekit_hook_2 initialization"
      - name: LOK OBSERVED init_failed terminal
        if: always() && contains(format(',{0},', steps.lok.outputs.terminal), ',init_failed,')
        run: echo "libreofficekit_hook_2 returned null"
      - name: LOK OBSERVED lok_initialized terminal
        if: always() && contains(format(',{0},', steps.lok.outputs.terminal), ',lok_initialized,')
        run: echo "Initialization completed; block follows it"
      - name: LOK OBSERVED document_load_failed terminal
        if: always() && contains(format(',{0},', steps.lok.outputs.terminal), ',document_load_failed,')
        run: echo "Document load returned null"
      - name: LOK OBSERVED document_loaded terminal
        if: always() && contains(format(',{0},', steps.lok.outputs.terminal), ',document_loaded,')
        run: echo "Document loaded; block follows it"
      - name: LOK OBSERVED pdf_export terminal
        if: always() && contains(format(',{0},', steps.lok.outputs.terminal), ',pdf_export,')
        run: echo "PDF export returned; cleanup follows"
      - name: LOK OBSERVED office_destroyed terminal
        if: always() && contains(format(',{0},', steps.lok.outputs.terminal), ',office_destroyed,')
        run: echo "Full LibreOfficeKit lifecycle completed"
      - name: LOK OBSERVED exception terminal
        if: always() && contains(format(',{0},', steps.lok.outputs.terminal), ',exception,')
        run: echo "Probe raised an exception"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writer-lok-focused-evidence
          path: |
            lab-evidence/standard-user/
            lab-evidence/standard-user-launch/
            lab-evidence/lok-exports.json
            lab-evidence/libreoffice-version.txt
            lab-evidence/writer-binary-hash.json
          if-no-files-found: warn
