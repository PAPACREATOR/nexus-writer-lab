name: Writer LibreOfficeKit focused diagnostic
on:
  workflow_dispatch:
  push:
    branches: ['work/writer-offline-symbol-reader-20261009']
    paths:
      - '.github/workflows/writer-lab-lok-focused.yml'
permissions:
  contents: read
jobs:
  lok:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      LAB_TRACE_LOK_STACKS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install existing external stack reader
        shell: pwsh
        run: ./lab/install-stack-tools.ps1
      - name: Check existing stack reader on synthetic helper
        shell: pwsh
        run: ./lab/check-stack-reader.ps1
      - name: Install archival Writer 26.2.6.2
        shell: pwsh
        run: ./lab/install-writer.ps1
      - name: Read exact Writer debug identifiers
        run: python lab/pe_debug_info.py
      - name: Fetch exact official mergedlo symbols
        run: python lab/fetch_writer_symbols.py --module mergedlo.dll
      - run: python -m pip install jsonschema==4.26.0 pytest==9.1.1
      - name: Official LibreOfficeKit probes inside unchanged native boundary
        shell: pwsh
        continue-on-error: true
        run: ./lab/run-standard-user.ps1 -Suite probe

      - name: Resolve captured LOK stacks offline
        if: always()
        shell: pwsh
        run: ./lab/resolve-writer-frames.ps1 -Stacks lab-evidence/standard-user-launch/lok-stacks

      - name: Parse LibreOfficeKit cases
        id: lok
        if: always()
        shell: pwsh
        run: |
          @'
          import json, os, pathlib
          root=pathlib.Path("lab-evidence")
          mapping={}
          for path in root.rglob("probe.json"):
              try:
                  obj=json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              case=str(obj.get("case") or "unknown")
              stages=obj.get("stages") or []
              last=stages[-1].get("stage") if stages and isinstance(stages[-1],dict) else "no_stage"
              mapping[case]={"last":last,"exit_code":obj.get("exit_code"),
                             "render_pass":bool(obj.get("render_pass")),
                             "seconds":obj.get("seconds"),
                             "has_pdf":"pdf" in obj,
                             "error":obj.get("error")}
              print(json.dumps({"case":case,**mapping[case]}, ensure_ascii=False))
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              for case in ("baseline","sal_log","long_path"):
                  row=mapping.get(case,{})
                  f.write(case + "_last=" + str(row.get("last","missing")) + "\n")
                  f.write(case + "_render=" + ("true" if row.get("render_pass") else "false") + "\n")
          '@ | python -

      - name: BASELINE reached loading_library only
        if: always() && steps.lok.outputs.baseline_last == 'loading_library'
        run: echo "baseline terminal loading_library"
      - name: BASELINE reached initializing_lok only
        if: always() && steps.lok.outputs.baseline_last == 'initializing_lok'
        run: echo "baseline terminal initializing_lok"
      - name: BASELINE full lifecycle
        if: always() && steps.lok.outputs.baseline_last == 'office_destroyed'
        run: echo "baseline terminal office_destroyed"
      - name: BASELINE rendered PDF
        if: always() && steps.lok.outputs.baseline_render == 'true'
        run: echo "baseline render PASS"

      - name: SALLOG reached loading_library only
        if: always() && steps.lok.outputs.sal_log_last == 'loading_library'
        run: echo "sal_log terminal loading_library"
      - name: SALLOG reached initializing_lok only
        if: always() && steps.lok.outputs.sal_log_last == 'initializing_lok'
        run: echo "sal_log terminal initializing_lok"
      - name: SALLOG full lifecycle
        if: always() && steps.lok.outputs.sal_log_last == 'office_destroyed'
        run: echo "sal_log terminal office_destroyed"
      - name: SALLOG rendered PDF
        if: always() && steps.lok.outputs.sal_log_render == 'true'
        run: echo "sal_log render PASS"

      - name: LONGPATH reached loading_library only
        if: always() && steps.lok.outputs.long_path_last == 'loading_library'
        run: echo "long_path terminal loading_library"
      - name: LONGPATH reached initializing_lok only
        if: always() && steps.lok.outputs.long_path_last == 'initializing_lok'
        run: echo "long_path terminal initializing_lok"
      - name: LONGPATH full lifecycle
        if: always() && steps.lok.outputs.long_path_last == 'office_destroyed'
        run: echo "long_path terminal office_destroyed"
      - name: LONGPATH rendered PDF
        if: always() && steps.lok.outputs.long_path_render == 'true'
        run: echo "long_path render PASS"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writer-lok-focused-evidence
          path: |
            lab-evidence/standard-user/
            lab-evidence/standard-user-launch/
            lab-evidence/lok-exports.json
            lab-evidence/libreoffice-version.txt
            lab-evidence/writer-binary-hash.json
            lab-evidence/pe-debug-info.json
            lab-evidence/writer-symbols.json
            lab-evidence/resolved-writer-frames*
            lab-evidence/standard-user-launch/lok-stacks/
            lab-evidence/stack-tools/*.json*
          if-no-files-found: warn
