name: Writer isolated candidate full regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: stress, shard: 0}
          - {suite: stress, shard: 1}
          - {suite: stress, shard: 2}
          - {suite: stress, shard: 3}
          - {suite: adverse, shard: 0}
          - {suite: bidirectional, shard: 0}
          - {suite: standard, shard: 0}
          - {suite: standard, shard: 1}
          - {suite: volume, shard: 0}
          - {suite: volume, shard: 1}
          - {suite: volume, shard: 2}
          - {suite: volume, shard: 3}
          - {suite: volume, shard: 4}
          - {suite: volume, shard: 5}
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install archival Writer 26.2.6.2
        shell: pwsh
        run: ./lab/install-writer.ps1
      - run: python -m pip install -r nexus/requirements-test.txt
      - name: Candidate suite with original assertions and 45-second Writer bound
        shell: pwsh
        run: ./lab/run-standard-user.ps1 -Suite ${{ matrix.suite }} -Shard ${{ matrix.shard }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writer-candidate-${{ matrix.suite }}-${{ matrix.shard }}
          path: |
            lab-evidence/standard-user/
            lab-evidence/standard-user-launch/
            lab-evidence/libreoffice-version.txt
            lab-evidence/writer-binary-hash.json
          if-no-files-found: error
  aggregate:
    needs: validation
    if: always()
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      # Official v4/v4.3.0 tag resolved with git ls-remote before pinning.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: writer-candidate-*
          path: lab-evidence/full-artifacts
          merge-multiple: false
      - name: Verify all required jobs, identities and 100 + 100 actual conversions
        if: always()
        shell: pwsh
        run: python -m lab.verify_full_coverage lab-evidence/full-artifacts --lab-sha '${{ github.sha }}' --output lab-evidence/full-coverage.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writer-full-coverage
          path: lab-evidence/full-coverage.json
          if-no-files-found: error
