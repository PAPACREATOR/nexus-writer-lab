name: Writer isolated candidate full regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: stress, shard: 0}
          - {suite: stress, shard: 1}
          - {suite: stress, shard: 2}
          - {suite: stress, shard: 3}
          - {suite: adverse, shard: 0}
          - {suite: standard, shard: 0}
          - {suite: standard, shard: 1}
          - {suite: volume, shard: 0}
          - {suite: volume, shard: 1}
          - {suite: volume, shard: 2}
          - {suite: volume, shard: 3}
          - {suite: volume, shard: 4}
          - {suite: volume, shard: 5}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install archival Writer 26.2.6.2
        shell: pwsh
        run: ./lab/install-writer.ps1
      - run: python -m pip install -r nexus/requirements-test.txt
      - name: Candidate suite with original assertions and 45-second Writer bound
        run: python -m lab.run_candidate_suite ${{ matrix.suite }} ${{ matrix.shard }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writer-candidate-${{ matrix.suite }}-${{ matrix.shard }}
          path: lab-evidence/candidate-${{ matrix.suite }}-${{ matrix.shard }}/
          if-no-files-found: error
