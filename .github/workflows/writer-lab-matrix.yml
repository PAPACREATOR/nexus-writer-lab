name: Writer isolated sequential matrix
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exactly the source Writer version
        shell: pwsh
        run: |
          $url = 'https://downloadarchive.documentfoundation.org/libreoffice/old/26.2.6.2/win/x86_64/LibreOffice_26.2.6.2_Win_x86-64.msi'
          $msi = Join-Path $env:RUNNER_TEMP 'LibreOffice_26.2.6.2_Win_x86-64.msi'
          Invoke-WebRequest $url -OutFile $msi
          if ((Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant() -ne '788ce7d4b56460357f57552cb8cd848e8f2254f28f6e51fa61e0c65a18096373') { throw 'Official archive hash mismatch' }
          $install = Start-Process msiexec.exe -ArgumentList @('/i', $msi, '/qn', '/norestart') -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -notin @(0,3010)) { throw "MSI failed: $($install.ExitCode)" }
          $exe = 'C:\Program Files\LibreOffice\program\soffice.com'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'Writer missing' }
          New-Item -ItemType Directory -Path lab-evidence -Force | Out-Null
          & $exe --version | Out-File lab-evidence/libreoffice-version.txt
          if ((Get-Content lab-evidence/libreoffice-version.txt -Raw) -notmatch '26\.2\.6\.2') { throw 'Wrong Writer build' }
          Get-ComputerInfo | Select-Object WindowsProductName,WindowsVersion,OsName,OsVersion,OsBuildNumber | ConvertTo-Json | Out-File lab-evidence/windows-version.json
          Get-FileHash 'C:\Program Files\LibreOffice\program\soffice.bin' | ConvertTo-Json | Out-File lab-evidence/writer-binary-hash.json
          "LIBREOFFICE_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install pinned bounded test dependencies
        run: python -m pip install jsonschema==4.26.0 pytest==9.1.1
      - name: A original baseline first
        id: baseline
        continue-on-error: true
        run: python -m lab.run_case A
      - name: Confirm original FAIL reached Writer before variants
        shell: pwsh
        run: |
          $logs = Get-Content lab-evidence/A/console.txt -Raw
          if ($logs -notmatch 'BLOCKED' -or $logs -notmatch 'Conversão excedeu o tempo permitido') {
            throw 'Original Writer timeout not reproduced: stop variants'
          }
      - name: B dedicated profile already present
        continue-on-error: true
        run: python -m lab.run_case B
      - name: C profile precreation already present
        continue-on-error: true
        run: python -m lab.run_case C
      - name: D per-task ACL already present
        continue-on-error: true
        run: python -m lab.run_case D
      - name: E norestore already present
        continue-on-error: true
        run: python -m lab.run_case E
      - name: F add only nolockcheck
        continue-on-error: true
        run: python -m lab.run_case F
      - name: G add only nologo to F
        continue-on-error: true
        run: python -m lab.run_case G
      - name: Preserve all observations including FAIL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writer-sequential-matrix
          path: lab-evidence/
          if-no-files-found: error
      - name: A matrix FAIL remains a FAIL
        if: always()
        shell: pwsh
        run: |
          $cases = Get-ChildItem lab-evidence -Recurse -Filter metadata.json
          if ($cases.Count -ne 7) { throw 'Matrix incomplete' }
          foreach ($case in $cases) {
            $result = Get-Content -LiteralPath $case.FullName -Raw | ConvertFrom-Json
            if ($result.pytest_exit_code -ne 0 -or -not $result.original_bytes_restored) { throw "Case $($result.variant) did not PASS" }
          }
