name: Writer non-admin original Procmon trace
on:
  workflow_dispatch:
    inputs:
      office_layout:
        description: Installation location inside the disposable fixture
        type: choice
        default: separate
        options: [separate, python-read-root]
permissions:
  contents: read
jobs:
  trace:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install archival Writer 26.2.6.2
        shell: pwsh
        run: ./lab/install-writer.ps1
      - run: python -m pip install jsonschema==4.26.0 pytest==9.1.1
      - name: Recorder observes; original Writer runs as standard account
        shell: pwsh
        run: ./lab/trace-procmon.ps1 -OfficeLayout '${{ inputs.office_layout }}'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writer-non-admin-procmon
          path: |
            lab-evidence/procmon/
            lab-evidence/standard-user/
            lab-evidence/standard-user-launch/
            lab-evidence/libreoffice-version.txt
            lab-evidence/writer-binary-hash.json
          if-no-files-found: error
