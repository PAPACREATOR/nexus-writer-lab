name: Writer original standard-user stack text only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stacks:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      LAB_TRACE_STACKS: '1'
      LAB_TRACE_WAITS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Official external stack reader
        shell: pwsh
        run: ./lab/install-stack-tools.ps1
      - name: Archival Writer
        shell: pwsh
        run: ./lab/install-writer.ps1
      - run: python -m pip install jsonschema==4.26.0 pytest==9.1.1
      - name: Original standard-user routes, non-invasive non-suspending stack text
        shell: pwsh
        run: ./lab/run-standard-user.ps1 -Suite baseline
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writer-stack-text-only
          path: |
            lab-evidence/stack-tools/*.json*
            lab-evidence/standard-user/A/*.json
            lab-evidence/standard-user/A/results.xml
            lab-evidence/standard-user/A/console.txt
            lab-evidence/standard-user/*.json
            lab-evidence/standard-user-launch/*.txt
            lab-evidence/standard-user-launch/*.json*
            lab-evidence/standard-user-launch/stacks/*.txt
            lab-evidence/standard-user-launch/stacks/*.json*
            lab-evidence/libreoffice-version.txt
            lab-evidence/writer-binary-hash.json
          if-no-files-found: error
