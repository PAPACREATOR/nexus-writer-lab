name: Writer original standard-user stack text only
on:
  workflow_dispatch:
    inputs:
      office_layout:
        description: Installation location inside the disposable fixture
        type: choice
        default: separate
        options: [separate, python-read-root]
permissions:
  contents: read
jobs:
  stacks:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      LAB_TRACE_STACKS: '1'
      LAB_TRACE_WAITS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Official external stack reader
        shell: pwsh
        run: ./lab/install-stack-tools.ps1
      - name: Independent LPAC reader controls, no Writer
        run: python -m lab.check_lpac_evidence --output lab-evidence/lpac-accesscheck-control.json
      - name: Check stack reader on a synthetic sleeping helper
        shell: pwsh
        run: ./lab/check-stack-reader.ps1
      - name: Archival Writer
        shell: pwsh
        run: ./lab/install-writer.ps1
      - name: On-disk Writer debug identifiers
        run: python lab/pe_debug_info.py
      - uses: actions/upload-artifact@v4
        with:
          name: writer-binary-debug-metadata
          path: lab-evidence/pe-debug-info.json
          if-no-files-found: error
      - name: Official symbols, Microsoft native-image binding verified
        run: python lab/fetch_writer_symbols.py --module mergedlo.dll
      - run: python -m pip install jsonschema==4.26.0 pytest==9.1.1
      - name: Original standard-user routes, non-invasive non-suspending stack text
        shell: pwsh
        run: ./lab/run-standard-user.ps1 -Suite baseline -OfficeLayout '${{ inputs.office_layout }}'
      - name: Resolve persisted stack addresses offline, no Writer execution
        if: always()
        shell: pwsh
        run: ./lab/resolve-writer-frames.ps1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writer-stack-text-only
          path: |
            lab-evidence/stack-tools/*.json*
            lab-evidence/lpac-accesscheck-control.json
            lab-evidence/stack-reader-check/*.txt
            lab-evidence/stack-reader-check/*.json
            lab-evidence/standard-user/A/*.json
            lab-evidence/standard-user/A/results.xml
            lab-evidence/standard-user/A/console.txt
            lab-evidence/standard-user/*.json
            lab-evidence/standard-user-launch/*.txt
            lab-evidence/standard-user-launch/*.json*
            lab-evidence/standard-user-launch/stacks/*.txt
            lab-evidence/standard-user-launch/stacks/*.json*
            lab-evidence/libreoffice-version.txt
            lab-evidence/writer-binary-hash.json
            lab-evidence/pe-debug-info.json
            lab-evidence/writer-symbols.json
            lab-evidence/resolved-writer-frames*
          if-no-files-found: error
