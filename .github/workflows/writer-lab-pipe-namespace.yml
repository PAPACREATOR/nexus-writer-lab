name: Writer LPAC named-pipe namespace differential (non-production)
on:
  push:
    branches:
      - 'lab/writer-lpac-pipe-namespace-*'
    paths:
      - 'lab/pipe_namespace_child.py'
      - 'lab/run_pipe_namespace_probe.py'
      - 'lab/user-bootstrap.ps1'
      - '.github/workflows/writer-lab-pipe-namespace.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native_diff:
    name: Original LPAC/Job and standard user; legacy vs LOCAL pipes
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install original LibreOffice Writer fixture (not the product)
        shell: pwsh
        run: ./lab/install-writer.ps1
      - name: Minimal pinned Python fixture dependencies
        run: python -m pip install jsonschema==4.26.0 pytest==9.1.1
      - name: Original standard-user LPAC with native namespace differential
        shell: pwsh
        run: ./lab/run-standard-user.ps1 -Suite pipe_namespaces -OfficeLayout separate
      - name: Preserve diagnostic regardless of result; no Writer PASS claim
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writer-lpac-pipe-namespaces-evidence
          path: |
            lab-evidence/standard-user/
            lab-evidence/standard-user-launch/
            lab-evidence/libreoffice-version.txt
            lab-evidence/writer-binary-hash.json
          if-no-files-found: error
