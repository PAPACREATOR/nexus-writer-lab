name: Writer bootstrap error classification
on:
  workflow_dispatch:
  push:
    branches: ['work/writer-offline-symbol-reader-20261009']
    paths:
      - '.github/workflows/writer-lab-bootstrap-log.yml'
      - 'lab/evidence_plugin.py'
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      LAB_WRITER_SAL_LOG: '+INFO.desktop.app'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install archival Writer 26.2.6.2
        shell: pwsh
        run: ./lab/install-writer.ps1
      - run: python -m pip install jsonschema==4.26.0 pytest==9.1.1
      - name: Original confined baseline with LibreOffice desktop.app INFO
        shell: pwsh
        continue-on-error: true
        run: ./lab/run-standard-user.ps1 -Suite baseline

      - name: Parse bounded bootstrap evidence
        id: classify
        if: always()
        shell: pwsh
        run: |
          @'
          import json, os, pathlib, re
          root=pathlib.Path("lab-evidence")
          texts=[]
          for path in root.rglob("*launches.json"):
              try:
                  rows=json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              if isinstance(rows, dict):
                  rows=[rows]
              for row in rows:
                  if not isinstance(row, dict):
                      continue
                  files=row.get("files") or {}
                  stderr=(files.get("office/stderr.txt") or {}).get("text")
                  if isinstance(stderr, str):
                      texts.append(stderr)
          joined="\n".join(texts)
          codes=sorted(set(re.findall(r"SetBootstrapError:\s*(\d+)\b", joined)))
          has_set=bool(codes)
          has_desktop="desktop.app" in joined
          selected=[line for line in joined.splitlines()
                    if re.search(r"SetBootstrapError|IPC_STATUS|desktop\.app|Bootstrap", line)]
          print(json.dumps({"codes":codes,"has_setbootstrap":has_set,"has_desktop_app":has_desktop,
                            "selected":selected[:120]}, ensure_ascii=False))
          output=os.environ["GITHUB_OUTPUT"]
          with open(output,"a",encoding="utf-8") as f:
              f.write("codes=" + ",".join(codes) + "\n")
              f.write("has_setbootstrap=" + ("true" if has_set else "false") + "\n")
              f.write("has_desktop=" + ("true" if has_desktop else "false") + "\n")
          '@ | python -

      - name: OBSERVED no SetBootstrapError
        if: always() && steps.classify.outputs.has_setbootstrap == 'false'
        run: echo "No SetBootstrapError line was emitted by the bounded desktop.app log."
      - name: OBSERVED BE_PATHINFO_MISSING 3
        if: always() && contains(format(',{0},', steps.classify.outputs.codes), ',3,')
        run: echo "BE_PATHINFO_MISSING observed"
      - name: OBSERVED BE_USERINSTALL_FAILED 4
        if: always() && contains(format(',{0},', steps.classify.outputs.codes), ',4,')
        run: echo "BE_USERINSTALL_FAILED observed"
      - name: OBSERVED BE_LANGUAGE_MISSING 5
        if: always() && contains(format(',{0},', steps.classify.outputs.codes), ',5,')
        run: echo "BE_LANGUAGE_MISSING observed"
      - name: OBSERVED BE_USERINSTALL_DISK 6
        if: always() && contains(format(',{0},', steps.classify.outputs.codes), ',6,')
        run: echo "BE_USERINSTALL_NOTENOUGHDISKSPACE observed"
      - name: OBSERVED BE_USERINSTALL_NOWRITEACCESS 7
        if: always() && contains(format(',{0},', steps.classify.outputs.codes), ',7,')
        run: echo "BE_USERINSTALL_NOWRITEACCESS observed"
      - name: OBSERVED BE_OFFICECONFIG_BROKEN 8
        if: always() && contains(format(',{0},', steps.classify.outputs.codes), ',8,')
        run: echo "BE_OFFICECONFIG_BROKEN observed"
      - name: OBSERVED desktop.app logging
        if: always() && steps.classify.outputs.has_desktop == 'true'
        run: echo "desktop.app category reached stderr evidence"
      - name: OBSERVED no desktop.app logging
        if: always() && steps.classify.outputs.has_desktop == 'false'
        run: echo "No desktop.app category line reached stderr evidence"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writer-bootstrap-log-evidence
          path: |
            lab-evidence/standard-user/
            lab-evidence/standard-user-launch/
            lab-evidence/libreoffice-version.txt
            lab-evidence/writer-binary-hash.json
          if-no-files-found: error
