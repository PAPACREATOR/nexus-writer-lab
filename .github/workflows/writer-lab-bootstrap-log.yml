name: Writer bootstrap error classification
on:
  workflow_dispatch:
  push:
    branches: ['work/writer-offline-symbol-reader-20261009']
    paths:
      - '.github/workflows/writer-lab-bootstrap-log.yml'
      - 'lab/evidence_plugin.py'
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      LAB_WRITER_SAL_LOG: '+INFO.desktop.app'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install archival Writer 26.2.6.2
        shell: pwsh
        run: ./lab/install-writer.ps1
      - run: python -m pip install jsonschema==4.26.0 pytest==9.1.1
      - name: Original confined baseline with LibreOffice desktop.app INFO
        shell: pwsh
        continue-on-error: true
        run: ./lab/run-standard-user.ps1 -Suite baseline
      - name: Extract bounded bootstrap log evidence
        if: always()
        shell: pwsh
        run: |
          $files=Get-ChildItem -LiteralPath lab-evidence -Recurse -Filter '*launches.json' -ErrorAction SilentlyContinue
          $found=$false
          foreach($file in $files) {
            $rows=Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json
            foreach($row in @($rows)) {
              $text=$row.files.'office/stderr.txt'.text
              if($text) {
                $selected=($text -split "`r?`n") | Where-Object { $_ -match 'SetBootstrapError|IPC_STATUS|desktop\.app|Bootstrap' }
                if($selected) {
                  $found=$true
                  Write-Host ('=== ' + $file.FullName + ' ===')
                  $selected | Select-Object -First 120 | ForEach-Object { Write-Host $_ }
                }
              }
            }
          }
          if(-not $found) { Write-Host 'NO_BOOTSTRAP_LOG_MATCH' }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writer-bootstrap-log-evidence
          path: |
            lab-evidence/standard-user/
            lab-evidence/standard-user-launch/
            lab-evidence/libreoffice-version.txt
            lab-evidence/writer-binary-hash.json
          if-no-files-found: error
