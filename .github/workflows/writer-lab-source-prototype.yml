name: Writer source prototype gate (no production changes)
on:
  push:
    branches: ['lab/writer-lpac-pipe-namespace-*']
    paths:
      - 'lab/patch_lpac_pipe_source.py'
      - 'lab/test_pipe_source_patch.py'
      - '.github/workflows/writer-lab-source-prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit_windows:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest==9.1.1
      - name: Validate fail-closed source prototype (NOT an executable Writer patch)
        run: python -m pytest lab/test_pipe_source_patch.py -q -p no:cacheprovider -o pythonpath=.
      - name: Verify the prototype applies to exact upstream LibreOffice 26.2.6.2 source
        shell: pwsh
        run: |
          $original = Join-Path $env:RUNNER_TEMP 'libreoffice-original-pipe.cxx'
          $patched = Join-Path $env:RUNNER_TEMP 'libreoffice-lpac-prototype-pipe.cxx'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/LibreOffice/core/libreoffice-26.2.6.2/sal/osl/w32/pipe.cxx' -OutFile $original -TimeoutSec 60
          if (-not (Test-Path -LiteralPath $original)) { throw 'UPSTREAM_SOURCE_MISSING' }
          python -m lab.patch_lpac_pipe_source --source $original --output $patched
          if ($LASTEXITCODE -ne 0) { throw 'UPSTREAM_SOURCE_PROTOTYPE_FAILED' }
          if (-not (Test-Path -LiteralPath $patched)) { throw 'UPSTREAM_PATCHED_OUTPUT_MISSING' }
          Write-Output ('ORIGINAL_SHA256=' + (Get-FileHash $original -Algorithm SHA256).Hash)
          Write-Output ('PROTOTYPE_SHA256=' + (Get-FileHash $patched -Algorithm SHA256).Hash)
          Write-Output 'No LibreOffice binary compiled or executed; conditional source patch only.'
      - name: Declare bounded result
        shell: pwsh
        run: |
          Write-Output 'SOURCE_ONLY=PASS; WRITER_COMPILED=NOT_RUN; BOOK=NOT_RUN; CONVERT_PDF=NOT_RUN'
