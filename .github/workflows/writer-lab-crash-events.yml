name: Writer relocated LOK crash event metadata only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crash_events:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact official archival fixture
        shell: pwsh
        run: ./lab/install-writer.ps1
      - run: python -m pip install jsonschema==4.26.0 pytest==9.1.1
      - name: Existing LOK candidate with relocated fixture, original native boundary
        shell: pwsh
        run: ./lab/run-standard-user.ps1 -Suite routes -OfficeLayout python-read-root
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writer-relocated-lok-crash-events
          path: |
            lab-evidence/standard-user/
            lab-evidence/standard-user-launch/
            lab-evidence/libreoffice-version.txt
            lab-evidence/writer-binary-hash.json
          if-no-files-found: error
