name: Writer original standard-user thread waits
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  waits:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      LAB_TRACE_WAITS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install archival Writer
        shell: pwsh
        run: ./lab/install-writer.ps1
      - run: python -m pip install jsonschema==4.26.0 pytest==9.1.1
      - name: Original routes, standard user; external read-only wait observer
        shell: pwsh
        run: ./lab/run-standard-user.ps1 -Suite baseline
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writer-thread-waits
          path: |
            lab-evidence/standard-user/
            lab-evidence/standard-user-launch/
            lab-evidence/libreoffice-version.txt
            lab-evidence/writer-binary-hash.json
          if-no-files-found: error
