name: Writer isolated ETW trace
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install archival Writer 26.2.6.2
        shell: pwsh
        run: ./lab/install-writer.ps1
      - name: Install pinned bounded test dependencies
        run: python -m pip install jsonschema==4.26.0 pytest==9.1.1
      - name: Observe baseline through ETW without changing Writer boundary
        shell: pwsh
        run: ./lab/trace-writer.ps1
      - name: Preserve raw trace and diagnostic evidence on FAIL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writer-etw-evidence
          path: lab-evidence/
          if-no-files-found: error
